name: sih25-dash
region: nyc
services:
  - name: api
    instance_count: 1
    instance_size_slug: basic-xxs
    dockerfile_path: Dockerfile.backend
    run_command: node src/server.js
    http_port: 5000
    routes:
      - path: /api
        preserve_path_prefix: true
    envs:
      - key: PORT
        value: "5000"
      - key: BACKEND_URL
        value: ${APP_URL}
      - key: FRONTEND_URL
        value: ${APP_URL}
      - key: DB_HOST
        scope: RUN_TIME
        value: ${db.HOSTNAME}
      - key: DB_USER
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      - key: DB_NAME
        scope: RUN_TIME
        value: ${db.DATABASE}
      - key: REDIS_HOST
        scope: RUN_TIME
        value: ${redis.HOSTNAME}
      - key: REDIS_PORT
        scope: RUN_TIME
        value: ${redis.PORT}
      - key: REDIS_PASSWORD
        scope: RUN_TIME
        value: ${redis.PASSWORD}
      - key: SPACES_KEY
        scope: RUN_TIME
      - key: SPACES_SECRET
        scope: RUN_TIME
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
      - key: SPACES_BUCKET
        scope: RUN_TIME
      - key: SPACES_CDN_URL
        scope: RUN_TIME

  - name: worker
    instance_count: 1
    instance_size_slug: basic-xs # FFmpeg needs more CPU
    dockerfile_path: Dockerfile.backend
    run_command: node src/worker.js
    envs:
      - key: DB_HOST
        scope: RUN_TIME
        value: ${db.HOSTNAME}
      - key: DB_USER
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      - key: DB_NAME
        scope: RUN_TIME
        value: ${db.DATABASE}
      - key: REDIS_HOST
        scope: RUN_TIME
        value: ${redis.HOSTNAME}
      - key: REDIS_PORT
        scope: RUN_TIME
        value: ${redis.PORT}
      - key: REDIS_PASSWORD
        scope: RUN_TIME
        value: ${redis.PASSWORD}
      - key: SPACES_KEY
        scope: RUN_TIME
      - key: SPACES_SECRET
        scope: RUN_TIME
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
      - key: SPACES_BUCKET
        scope: RUN_TIME

  - name: frontend
    instance_count: 1
    instance_size_slug: basic-xxs
    dockerfile_path: Dockerfile.frontend
    http_port: 80
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: ${APP_URL}/api

databases:
  - name: db
    engine: MYSQL
    version: "8"
    production: false
  - name: redis
    engine: REDIS
    version: "7"
    production: false
