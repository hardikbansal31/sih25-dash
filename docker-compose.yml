version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vid
      MYSQL_USER: dashuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node src/server.js
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost
      BACKEND_URL: http://localhost:5000
      DB_HOST: db
      DB_USER: dashuser
      DB_PASSWORD: mypassword
      DB_NAME: vid
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    volumes:
      - compressed_data:/app/compressed
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node src/worker.js
    restart: always
    environment:
      DB_HOST: db
      DB_USER: dashuser
      DB_PASSWORD: mypassword
      DB_NAME: vid
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
      - api
    volumes:
      - compressed_data:/app/compressed
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
  redis_data:
  compressed_data:
  uploads_data:
